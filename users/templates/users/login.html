{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | BlogPost</title>

    <link rel="stylesheet" href="{% static 'css/users.css' %}">
    <script src="{% static 'js/users.js' %}" defer></script>
</head>

<body>

<div class="container">

    <div class="card">

        <h1 class="title">Login</h1>

        <p class="subtitle">
            Enter your username and password
        </p>

        <form method="POST" class="form-box">

            {% csrf_token %}

            {{ form.as_p }}

            <button class="btn primary full-btn" type="submit">
                Login
            </button>

        </form>

        <p class="signup-text">
            Don't have an account?
            <a class="signup-link" href="{% url 'users:signup' %}">
                Create one
            </a>
        </p>

    </div>

</div>

</body>
</html>
