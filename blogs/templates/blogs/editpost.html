{% extends 'base.html' %}
{% load static %}

{% block title %}Edit Post{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/blogs/editpost.css' %}">
{% endblock %}

{% block content %}

<section class="edit-wrapper">

    <div class="edit-container">

        <h1 class="page-title">Edit Post</h1>

        {% if post.image %}
        <div class="edit-image-preview">
            <img src="{{ post.image.url }}">
        </div>
        {% endif %}

        <form method="POST" class="edit-form">
            {% csrf_token %}

            <div class="form-group">
                <label>Title</label>
                {{ form.title }}
            </div>

            <div class="form-group">
                <label>Content</label>
                {{ form.maincontent }}
            </div>

            <button type="submit" class="btn update-btn">
                Update Post
            </button>
        </form>

        <a href="{% url 'blogs:myposts' %}" class="back-link">
            ← Back to My Posts
        </a>

    </div>

</section>

{% endblock %}
