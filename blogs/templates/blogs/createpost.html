{% extends "base.html" %}
{% load static %}

{% block title %}Create Post{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/blogs.css' %}">
{% endblock %}

{% block content %}

<h1 class="page-title">Create Your Post</h1>

<div class="form-container">
    <form method="POST" enctype="multipart/form-data" class="form-box">
        {% csrf_token %}

        <label>Image</label>
        {{ form.image }}

        <label for="id_title">Title</label>
        {{ form.title }}

        <label for="id_maincontent">Content</label>
        {{ form.maincontent }}

        <button class="btn primary full-btn" type="submit">Create Post</button>
    </form>
</div>

{% endblock %}
