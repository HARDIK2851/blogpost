{% extends "base.html" %}
{% load static %}

{% block title %}Blogs{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/blogs.css' %}">
{% endblock %}

{% block content %}

<h1 class="page-title">Blog List</h1>

<a class="btn create-btn" href="{% url 'blogs:createpost' %}">
    Create Post
</a>

<div class="posts-container">



    {% for post in posts %}

    <div class="post-card">

        <h2>
            <a class="post-title" href="{% url 'blogs:postdetail' post.id %}">
                {{ post.title }}
            </a>
        </h2>

        <p class="meta">Author: {{ post.author }}</p>
        <p class="meta">Created: {{ post.datecreated }}</p>

    </div>

    {% endfor %}

</div>

{% endblock %}
